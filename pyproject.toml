[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-recommender-system"
version = "0.1.0"
description = "A hybrid music recommendation system with a Streamlit UI and reusable recommendation core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.5,<2.0",
    "numpy>=2.2,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.6,<2.0",
    "streamlit>=1.51,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
include = ["music_recommender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
